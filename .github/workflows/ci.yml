name: CI
run-name: ${{ inputs.update_browser_snapshots && 'Linux browser baseline review' || 'CI' }} · ${{ github.sha }}

# All jobs use the existing OPC Runner; browser libraries live in a pinned container.
on:
  workflow_dispatch:
    inputs:
      update_browser_snapshots:
        description: Generate Linux visual baselines for review only (no release acceptance)
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ !inputs.update_browser_snapshots }}
    runs-on: [self-hosted, cpa, build]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install frontend and OpenAPI dependencies
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep sqlite3
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf -y install ripgrep sqlite
          fi
          npm ci --prefix frontend --registry=https://registry.npmmirror.com
          npm ci --prefix tools/openapi --registry=https://registry.npmmirror.com

      - name: Provide docker compose shim when Docker is absent
        shell: bash
        run: |
          set -euo pipefail
          if command -v docker >/dev/null 2>&1; then
            echo "docker present: $(docker --version)"
            exit 0
          fi
          if ! command -v podman-compose >/dev/null 2>&1; then
            echo "neither docker nor podman-compose is available" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          # Only `docker compose ...` is mapped; compose files are validated with
          # podman-compose so the shared quality gate stays unchanged.
          cat > "$RUNNER_TEMP/bin/docker" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "compose" ]; then
            shift
            args=()
            while [ "$#" -gt 0 ]; do
              case "$1" in
                --project-directory) shift 2 ;;
                --project-directory=*) shift ;;
                *) args+=("$1"); shift ;;
              esac
            done
            exec podman-compose "${args[@]}"
          fi
          echo "docker $* is unavailable on this runner; only 'docker compose' is shimmed to podman-compose" >&2
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/bin/docker"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "installed podman-compose backed docker shim"

      - name: Run local quality gate
        run: make -f scripts/build.mk verify

  browser:
    needs: validate
    if: ${{ !cancelled() && (needs.validate.result == 'success' || inputs.update_browser_snapshots) }}
    runs-on: [self-hosted, cpa, build]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install browser dependencies
        run: |
          npm ci --prefix frontend --registry=https://registry.npmmirror.com

      - name: Run React browser matrix
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_browser_snapshots || false }}
        run: sh scripts/browser-ci.sh "$UPDATE_SNAPSHOTS"

      - name: Upload Linux visual baselines for review
        if: ${{ inputs.update_browser_snapshots && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-browser-baselines-${{ github.sha }}
          path: frontend/e2e/**/*-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ github.sha }}
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/error-context.md
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [validate, browser]
    runs-on: [self-hosted, cpa, build]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release archive
        run: sh scripts/package-release.sh "dist/codex-cpa-pool-${GITHUB_SHA::12}.tar.gz"

      - name: Verify Go-only release archive
        run: |
          archive="dist/codex-cpa-pool-${GITHUB_SHA::12}.tar.gz"
          go run ./cmd/releasectl archive verify "$archive"
          tar -tzf "$archive" | grep -Fx docker-compose.yml
          tar -tzf "$archive" | grep -Fx release-manifest.json
          tar -tzf "$archive" | grep -Fx Dockerfile
          tar -tzf "$archive" | grep -Fx cmd/admin/main.go
          tar -tzf "$archive" | grep -Fx cmd/gateway/main.go
          tar -tzf "$archive" | grep -Fx cmd/releasectl/main.go
          tar -tzf "$archive" | grep -Fx internal/gateway/server.go
          tar -tzf "$archive" | grep -Fx frontend/package.json
          tar -tzf "$archive" | grep -Fx tools/openapi/package.json
          tar -tzf "$archive" | grep -Fx scripts/run.sh
          if tar -tzf "$archive" | grep -Eq '^scripts/(cpac|install-cpac\.sh|deploy-target\.sh)$'; then
            echo "release archive contains a removed deployment entry" >&2
            exit 1
          fi
          removed_source_suffix=$(printf '.%s%s' p y)
          removed_requirement_prefix=$(printf 'require%s' ments)
          if tar -tzf "$archive" | grep -Eq "(^|/)(node_modules|dist|coverage|playwright-report|test-results)/|\\${removed_source_suffix}$|${removed_requirement_prefix}[^/]*\\.txt$"; then
            echo "release archive contains generated dependencies or removed runtime files" >&2
            exit 1
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: codex-cpa-pool-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
