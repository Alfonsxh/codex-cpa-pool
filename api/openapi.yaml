            application/json:
              schema:
                $ref: "#/components/schemas/PortalAccounts"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /usage/me/route:
    get:
      operationId: getPortalRoute
      tags: [portal]
      security:
        - portalSession: []
      responses:
        "200":
          description: Lightweight current route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalRoute"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /usage/me/route/auto-assign:
    post:
      operationId: autoAssignPortalRoute
      tags: [portal]
      security:
        - portalSession: []
      description: >-
        Idempotently assigns the authenticated user only when no current route exists. Candidates
        are restricted to the user's active Key records and require a fresh, reliable, available
        default weekly quota state. The lowest used percentage wins with a deterministic account-ID
        tie break, and the selected route is activated through the normal Gateway snapshot path.
      responses:
        "200":
          description: Existing route retained or a new route activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalRouteMutationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /usage/me/usage-breakdown:
    get:
      operationId: getPortalUsageBreakdown
      tags: [portal]
      security:
        - portalSession: []
      parameters:
        - name: account
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PortalUsageWindowQuery"
      responses:
        "200":
          description: Current user's usage breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageBreakdown"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /usage/me/usage-trend:
    get:
      operationId: getPortalUsageTrend
      tags: [portal]
      security:
        - portalSession: []
      parameters:
        - name: window
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PortalUsageTrendWindow"
        - name: dimension
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PortalUsageTrendDimension"
      responses:
        "200":
          description: Current Session user's natural-day usage trend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUsageTrend"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /usage/me/password:
    put:
      operationId: updatePortalPassword
      tags: [portal]
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalPasswordRequest"
      responses:
        "200":
          description: Password changed and required-change flag cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalPasswordResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /usage/me/group:
    put:
      operationId: updatePortalRoute
      tags: [portal]
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalRouteRequest"
      responses:
        "200":
          description: Route update after Gateway activation confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalRouteMutationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /usage/me/key/rotate:
    post:
      operationId: rotatePortalKey
      tags: [portal]
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalRotateKeyRequest"
      responses:
        "200":
          description: One-time replacement API Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalRotateKeyResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: cpa_admin_session
    portalSession:
      type: apiKey
      in: cookie
      name: cpa_usage_session
  parameters:
    ManagementKey:
      name: X-Management-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 12
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
    AccountQuery:
      name: account
      in: query
      required: true
      schema:
        type: string
    EmailQuery:
      name: email
      in: query
      required: true
      schema:
        type: string
        format: email
    UsageWindowQuery:
      name: window
      in: query
      required: false
      description: Route-specific usage range; `custom` also requires `start_at` and `end_at`.
      schema:
        $ref: "#/components/schemas/UsageWindow"
    UsageStartAtQuery:
      name: start_at
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
    UsageEndAtQuery:
      name: end_at
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    PortalUsageWindowQuery:
      name: window
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/PortalUsageWindow"
  responses:
    AccountLifecycleConflictResponse:
      description: Safety conflict; `error.code` is `account_requests_active` when Codex requests are still in flight.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AccountLifecycleUnavailableResponse:
      description: Account mutation is unavailable; `error.code` is `account_lifecycle_not_ready` when durable recovery or safe evacuation cannot proceed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ErrorResponse:
      description: Safe JSON error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MessageResponse:
      description: Successful mutation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
    AdminSessionResponse:
      description: Authenticated Admin session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminSession"
    PortalSessionResponse:
      description: Authenticated self-service session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PortalSession"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    PublicSiteLogo:
      type: object
      additionalProperties: false
      required: [custom, url, content_type, sha256, updated_at]
      properties:
        custom: { type: boolean }
        url: { type: string }
        content_type: { type: string }
        sha256: { type: string }
        updated_at: { type: [integer, "null"], format: int64 }
    PublicSiteConfiguration:
      type: object
      additionalProperties: false
      required:
        - version
        - timezone
        - product_name
        - short_name
        - environment_label
        - public_base_url
        - allowed_email_domains
        - provider_name
        - api_key_env
        - default_model
        - logo
      properties:
        version: { type: integer, const: 1 }
        timezone:
          type: string
          description: IANA timezone configured by system.timezone for all business dates and displays
        product_name: { type: string }
        short_name: { type: string }
        environment_label: { type: string }
        public_base_url: { type: string }
        allowed_email_domains:
          type: array
          description: Public email suffixes accepted by user creation and Usage Center login
          items: { type: string }
        provider_name: { type: string }
        api_key_env: { type: string }
        default_model: { type: string }
        logo: { $ref: "#/components/schemas/PublicSiteLogo" }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        type:
          type: string
    MessageResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
    LoggedOutResponse:
      type: object
      additionalProperties: false
      required: [logged_out]
      properties:
        logged_out:
          type: boolean
          const: true
    AdminSession:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          const: true
        csrf_token:
          type: string
        idle_expires_at:
          type: integer
          format: int64
        absolute_expires_at:
          type: integer
          format: int64
    OverviewPayload:
      type: object
      additionalProperties: false
      required: [generated_at, source, summary]
      properties:
        generated_at:
          type: integer
          format: int64
        source:
          type: string
          const: control-plane
        summary:
          $ref: "#/components/schemas/OverviewSummary"
    OverviewSummary:
      type: object
      additionalProperties: false
      required:
        - accounts
        - enabled_accounts
        - users
        - active_users
        - active_keys
        - routed_users
        - unassigned_users
        - teams
        - incomplete_key_matrices
      properties:
        accounts: { type: integer }
        enabled_accounts: { type: integer }
        users: { type: integer }
        active_users: { type: integer }
        active_keys: { type: integer }
        routed_users: { type: integer }
        unassigned_users: { type: integer }
        teams: { type: integer }
        incomplete_key_matrices: { type: integer }
    OverviewCatalog:
      type: object
      additionalProperties: false
      required: [generated_at, accounts, users]
      properties:
        generated_at:
          type: integer
          format: int64
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/OverviewCatalogAccount"
        users:
          type: array
          items:
            $ref: "#/components/schemas/OverviewCatalogUser"
    OverviewCatalogAccount:
      type: object
      additionalProperties: false
      required: [id, operational_status]
      properties:
        id:
          type: string
        operational_status:
          $ref: "#/components/schemas/AccountOperationalStatus"
    OverviewCatalogUser:
      type: object
      additionalProperties: false
      required: [email, status]
      properties:
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, inactive]
    OverviewStatusPayload:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - authorized_accounts
        - running_services
        - total_services
        - requests_5m
        - account_quota
        - warnings
      properties:
        generated_at:
          type: integer
          format: int64
        authorized_accounts:
          type: integer
        running_services:
          type: integer
        total_services:
          type: integer
        requests_5m:
          type: integer
          format: int64
        account_quota:
          $ref: "#/components/schemas/OverviewAccountQuotaSummary"
        warnings:
          type: array
          items:
            type: string
    OverviewAccountQuotaSummary:
      type: object
      additionalProperties: false
      required:
        - available
        - enabled_accounts
        - known_accounts
        - unknown_accounts
        - average_used_percent
        - average_remaining_percent
        - equivalent_remaining_accounts
        - exhausted_accounts
        - high_risk_accounts
      properties:
        available: { type: boolean }
        enabled_accounts: { type: integer, minimum: 0 }
        known_accounts: { type: integer, minimum: 0 }
        unknown_accounts: { type: integer, minimum: 0 }
        average_used_percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        average_remaining_percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        equivalent_remaining_accounts: { type: number, minimum: 0 }
        exhausted_accounts: { type: integer, minimum: 0 }
        high_risk_accounts: { type: integer, minimum: 0 }
    OnboardingStep:
      type: object
      additionalProperties: false
      required: [id, kind, status, title, description, action_path, blockers]
      properties:
        id: { type: string }
        kind: { type: string, enum: [required, recommended] }
        status: { type: string, enum: [complete, incomplete, blocked, skipped, unavailable] }
        title: { type: string }
        description: { type: string }
        action_path: { type: string }
        blockers:
          type: array
          items: { type: string }
    OnboardingRequiredProgress:
      type: object
      additionalProperties: false
      required: [complete, total]
      properties:
        complete: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    OnboardingRecommendedProgress:
      type: object
      additionalProperties: false
      required: [complete, skipped, total]
      properties:
        complete: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    OnboardingStatus:
      type: object
      additionalProperties: false
      required:
        - version
        - generated_at
        - required_complete
        - required
        - recommended
        - skipped_recommended
        - steps
      properties:
        version: { type: integer, minimum: 1 }
        generated_at: { type: integer, format: int64 }
        required_complete: { type: boolean }
        required: { $ref: "#/components/schemas/OnboardingRequiredProgress" }
        recommended: { $ref: "#/components/schemas/OnboardingRecommendedProgress" }
        skipped_recommended:
          type: array
          items: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/OnboardingStep" }
    OnboardingPreferencesRequest:
      type: object
      additionalProperties: false
      required: [confirm, skipped_recommended]
      properties:
        confirm: { type: string, const: save }
        skipped_recommended:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [public_base_url, quota_timezone, weekly_quota, notifications, branding, proxy]
    AccountState:
      type: object
      additionalProperties: false
      required:
        - account
        - eligible
        - exhausted
        - reason
        - used_percent
        - remaining_percent
        - headroom
        - reset_at
        - observed_at
      properties:
        account: { type: string }
        eligible: { type: boolean }
        exhausted: { type: boolean }
        reason: { type: string }
        used_percent: { type: [number, "null"] }
        remaining_percent: { type: [number, "null"] }
        headroom: { type: number }
        reset_at: { type: integer, format: int64 }
        observed_at: { type: integer, format: int64 }
    AccountWeeklyWindow:
      type: object
      additionalProperties: false
      required:
        - key
        - label
        - metered_feature
        - window_slot
        - used_percent
        - remaining_percent
        - reported_used_percent
        - reset_at
        - reset_after_seconds
        - window_seconds
        - limit_reached
        - resettable
      properties:
        key: { type: string }
        label: { type: string }
        metered_feature: { type: [string, "null"] }
        window_slot: { type: string }
        used_percent: { type: number }
        remaining_percent: { type: number }
        reported_used_percent: { type: number }
        reset_at: { type: [integer, "null"], format: int64 }
        reset_after_seconds: { type: [integer, "null"], format: int64 }
        window_seconds: { type: integer, format: int64 }
        limit_reached: { type: boolean }
        resettable: { type: boolean }
    AccountQuota:
      type: object
      additionalProperties: false
      required: [account, status, plan_type, allowed, limit_reached, reset_credit_count, weekly, weekly_windows]
      properties:
        account: { type: string }
        status: { type: string }
        plan_type: { type: [string, "null"] }
        allowed: { type: [boolean, "null"] }
        limit_reached: { type: [boolean, "null"] }
        reset_credit_count: { type: [integer, "null"], format: int64 }
        weekly:
          oneOf:
            - $ref: "#/components/schemas/AccountWeeklyWindow"
            - type: "null"
        weekly_windows:
          type: array
          items: { $ref: "#/components/schemas/AccountWeeklyWindow" }
    AccountRuntime:
      type: object
      additionalProperties: false
      required:
        - state
        - query_status
        - credential_status
        - credential_count
        - credential_unavailable
        - credential_unavailable_count
        - credential_disabled
        - credential_disabled_count
        - native_success
        - native_failed
        - error_log_files
        - error_log_status
        - window_seconds
        - requests
        - error_count
        - rate_429_count
        - server_error_count
        - affected_users
        - last_error_at
        - last_error_status
        - error_rate_percent
        - error_age_seconds
      properties:
        state: { type: string }
        query_status: { type: string }
        credential_status: { type: string }
        credential_count: { type: integer }
        credential_unavailable: { type: boolean }
        credential_unavailable_count: { type: integer }
        credential_disabled: { type: boolean }
        credential_disabled_count: { type: integer }
        native_success: { type: integer, format: int64 }
        native_failed: { type: integer, format: int64 }
        error_log_files: { type: integer }
        error_log_status: { type: string }
        window_seconds: { type: integer, format: int64 }
        requests: { type: integer }
        error_count: { type: integer }
        rate_429_count: { type: integer }
        server_error_count: { type: integer }
        affected_users: { type: integer }
        last_error_at: { type: integer, format: int64 }
        last_error_status: { type: integer }
        error_rate_percent: { type: number }
        error_age_seconds: { type: [integer, "null"], format: int64 }
    AccountOperationalStatus:
      type: object
      additionalProperties: false
      required: [code, label, tone, reason, selectable]
      properties:
        code: { type: string }
        label: { type: string }
        tone: { type: string, enum: [success, warning, danger, neutral] }
        reason: { type: string }
        selectable: { type: boolean }
    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - port
        - proxy_mode
        - proxy_source
        - proxy_display
        - enabled
        - default
        - service
        - container_state
        - container_status
        - container_health
        - runtime_state
        - oauth_configured
        - auth_files
        - auth_state
        - associated_users
        - routed_users
        - active_users_1h
        - active_user_emails_1h
        - reset_credit_count
        - resettable
        - reset_window_labels
        - quota
        - usage
        - usage_available
        - usage_window_start_at
        - usage_window_available
        - account_state
        - runtime
        - operational_status
        - state_available
        - proxy_configured
      properties:
        id: { type: string }
        email: { type: string, format: email }
        port: { type: integer }
        proxy_mode: { type: string }
        proxy_source: { type: string, enum: [account, default, direct] }
        proxy_display:
          type: string
          description: Effective proxy URL with password redacted, or direct; never contains a plaintext proxy password.
        enabled: { type: boolean }
        default: { type: boolean }
        service: { type: string }
        container_state: { type: string }
        container_status: { type: string }
        container_health: { type: string }
        runtime_state: { type: string, enum: [running, stopped, disabled, unknown] }
        oauth_configured: { type: [boolean, "null"] }
        auth_files: { type: integer }
        auth_state: { type: string, enum: [configured, pending, unknown] }
        associated_users: { type: integer }
        routed_users: { type: integer }
        active_users_1h: { type: [integer, "null"] }
        active_user_emails_1h:
          type: array
          items: { type: string, format: email }
          description: Authenticated rolling-hour distinct user identities, sorted by normalized email
        reset_credit_count: { type: [integer, "null"], format: int64 }
        resettable: { type: boolean }
        reset_window_labels:
          type: array
          items: { type: string }
        quota: { $ref: "#/components/schemas/AccountQuota" }
        usage: { $ref: "#/components/schemas/UsageMetrics" }
        usage_available: { type: boolean }
        usage_window_start_at: { type: [integer, "null"], format: int64 }
        usage_window_available: { type: boolean }
        account_state: { $ref: "#/components/schemas/AccountState" }
        runtime: { $ref: "#/components/schemas/AccountRuntime" }
        operational_status: { $ref: "#/components/schemas/AccountOperationalStatus" }
        state_available: { type: boolean }
        proxy_configured: { type: boolean }
    AccountModels:
      type: object
      required: [account, models]
      properties:
        account: { type: string }
        models:
          type: array
          items: { type: string }
    AccountModelTestRequest:
      type: object
      required: [account, model]
      properties:
        account: { type: string }
        model: { type: string, minLength: 1, maxLength: 128 }
    AccountModelTestResult:
      type: object
      required: [account, model, success, elapsed_ms, checked_at, upstream_status, code, message]
      properties:
        account: { type: string }
        model: { type: string }
        success: { type: boolean }
        elapsed_ms: { type: integer, format: int64 }
        checked_at: { type: integer, format: int64 }
        upstream_status: { type: integer }
        code: { type: string }
        message: { type: string }
    AccountCatalog:
      type: object
      additionalProperties: false
      required:
        - accounts
        - generated_at
        - window
        - window_seconds
        - window_start_at
        - window_start_at_by_account
        - window_end_at
        - window_timezone
        - active_user_window_seconds
        - quota_generated_at
        - quota_cached
        - quota_refreshing
        - quota_cache_ttl_seconds
        - collector
        - warnings
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/Account" }
        generated_at: { type: integer, format: int64 }
        window:
          oneOf:
            - type: integer
            - type: string
        window_seconds: { type: [integer, "null"], format: int64 }
        window_start_at: { type: [integer, "null"], format: int64 }
        window_start_at_by_account:
          type: [object, "null"]
          additionalProperties: { type: integer, format: int64 }
        window_end_at: { type: [integer, "null"], format: int64 }
        window_timezone: { type: string }
        active_user_window_seconds: { type: integer, format: int64, description: Rolling distinct-user activity window in seconds. }
        quota_generated_at: { type: [integer, "null"], format: int64 }
        quota_cached: { type: boolean }
        quota_refreshing: { type: boolean }
        quota_cache_ttl_seconds: { type: integer, format: int64 }
        collector: { $ref: "#/components/schemas/CollectorStatus" }
        warnings:
          type: array
          items: { type: string }
    AccountLifecycleRecord:
      type: object
      additionalProperties: false
      required: [id, email, port, proxy_mode, created_at, group_enabled, default_group]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,31}$"
        email: { type: string, format: email }
        port: { type: integer, minimum: 1, maximum: 65535 }
        proxy_mode: { type: string, enum: [inherit, custom, direct] }
        created_at: { type: integer, format: int64 }
        group_enabled: { type: boolean }
        default_group: { type: boolean }
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required: [id, email, proxy_mode]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9-]{1,31}$"
        email: { type: string, format: email }
        proxy_mode: { type: string, enum: [inherit, custom, direct] }
        proxy_url:
          type: string
          maxLength: 2048
          writeOnly: true
    AccountCreateResult:
      type: object
      additionalProperties: false
      required: [account, created_key_rows, snapshot_generation]
      properties:
        account: { $ref: "#/components/schemas/AccountLifecycleRecord" }
        created_key_rows: { type: integer, minimum: 0 }
        snapshot_generation: { type: string }
    AccountCreateResponse:
      type: object
      additionalProperties: false
      required: [message, account]
      properties:
        message: { type: string }
        account: { $ref: "#/components/schemas/AccountCreateResult" }
    AccountUpdateRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9-]{1,31}$"
        new_id:
          type: string
