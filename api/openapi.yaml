openapi: 3.1.0
info:
  title: Codex CPA Pool v2 API
  version: 2.0.0-dev
  description: >-
    Contract for the Go Admin, self-service and public configuration APIs.
servers:
  - url: /
tags:
  - name: health
  - name: admin-session
  - name: admin-overview
  - name: admin-onboarding
  - name: admin-accounts
  - name: admin-runtime
  - name: admin-users
  - name: admin-teams
  - name: admin-settings
  - name: public-site
  - name: portal
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      responses:
        "200":
          description: Process and backing-store health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /site-config.json:
    get:
      operationId: getPublicSiteConfiguration
      tags: [public-site]
      responses:
        "200":
          description: Browser-safe branding, accepted email suffixes and client export defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSiteConfiguration"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/session:
    post:
      operationId: createAdminSession
      tags: [admin-session]
      parameters:
        - $ref: "#/components/parameters/ManagementKey"
      responses:
        "201":
          $ref: "#/components/responses/AdminSessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    get:
      operationId: getAdminSession
      tags: [admin-session]
      security:
        - adminSession: []
      responses:
        "200":
          $ref: "#/components/responses/AdminSessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteAdminSession
      tags: [admin-session]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggedOutResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/session/refresh:
    post:
      operationId: refreshAdminSession
      tags: [admin-session]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          $ref: "#/components/responses/AdminSessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/overview/summary:
    get:
      operationId: getAdminOverviewSummary
      tags: [admin-overview]
      security:
        - adminSession: []
      responses:
        "200":
          description: Secret-free control-plane totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewPayload"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/overview/catalog:
    get:
      operationId: getAdminOverviewCatalog
      tags: [admin-overview]
      security:
        - adminSession: []
      responses:
        "200":
          description: Selector identities with current operational status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewCatalog"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/overview/status:
    get:
      operationId: getAdminOverviewStatus
      tags: [admin-overview]
      security:
        - adminSession: []
      responses:
        "200":
          description: Runtime-bound overview counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewStatusPayload"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/onboarding:
    get:
      operationId: getAdminOnboarding
      tags: [admin-onboarding]
      security:
        - adminSession: []
      responses:
        "200":
          description: Secret-free first-run configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/onboarding/preferences:
    put:
      operationId: updateAdminOnboardingPreferences
      tags: [admin-onboarding]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingPreferencesRequest"
      responses:
        "200":
          description: Updated onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/accounts/models:
    get:
      operationId: listAccountModels
      tags: [admin-accounts]
      security:
        - adminSession: []
      parameters:
        - name: account
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Models advertised by the selected account; no inference performed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountModels"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/accounts/model-test:
    post:
      operationId: testAccountModel
      tags: [admin-accounts]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountModelTestRequest"
      responses:
        "200":
          description: Fixed short generation test, bounded to 25 seconds; upstream failures are returned as unsuccessful results without invalidating the Admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountModelTestResult"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/accounts:
    get:
      operationId: listAdminAccounts
      tags: [admin-accounts]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/UsageWindowQuery"
        - $ref: "#/components/parameters/UsageStartAtQuery"
        - $ref: "#/components/parameters/UsageEndAtQuery"
        - name: fresh
          in: query
          description: Request a single-flight official quota refresh when the persistent snapshot is old enough.
          schema: { type: string, enum: ["0", "1"], default: "0" }
      responses:
        "200":
          description: Account catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCatalog"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createAdminAccount
      tags: [admin-accounts]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
      responses:
        "201":
          description: Account created, rendered, probed, and activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCreateResponse"
        "503":
          $ref: "#/components/responses/AccountLifecycleUnavailableResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/accounts/update:
    post:
      operationId: updateAdminAccount
      tags: [admin-accounts]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
      responses:
        "200":
          description: Account state and runtime updated with compensating rollback protection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUpdateResponse"
        "409":
          $ref: "#/components/responses/AccountLifecycleConflictResponse"
        "503":
          $ref: "#/components/responses/AccountLifecycleUnavailableResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/accounts/policy:
    post:
      operationId: updateAdminAccountPolicy
      tags: [admin-accounts]
      description: >-
        Updates only group_enabled, default_group and fallback_account. Disabling atomically
        moves existing user routes to an enabled eligible fallback and publishes the Gateway
        snapshot. Account containers and existing streams are preserved; identity and proxy
        changes must use the account update endpoint.
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
      responses:
        "200":
          description: Account selection policy updated with safe fallback routing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUpdateResponse"
        "409":
          $ref: "#/components/responses/AccountLifecycleConflictResponse"
        "503":
          $ref: "#/components/responses/AccountLifecycleUnavailableResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/accounts/repair-proxy:
    post:
      operationId: repairUnavailableAdminAccountProxy
      tags: [admin-accounts]
      description: >-
        Last-resort, explicitly confirmed recovery for one routed account when the source is
        ineligible and no eligible fallback exists. Only a new custom proxy may change; ordinary
        account maintenance remains fail-closed and uses route evacuation plus in-flight drain.
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProxyRepairRequest"
      responses:
        "200":
          description: Ineligible account proxy reprojected and runtime probed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUpdateResponse"
        "409":
          $ref: "#/components/responses/AccountLifecycleConflictResponse"
        "503":
          $ref: "#/components/responses/AccountLifecycleUnavailableResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/accounts/clear-auth:
    post:
      operationId: clearAdminAccountAuth
      tags: [admin-accounts]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountClearAuthRequest"
      responses:
        "200":
          description: OAuth files archived, cleared, and account restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountClearAuthResponse"
        "503":
          $ref: "#/components/responses/AccountLifecycleUnavailableResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/accounts/delete:
    post:
      operationId: deleteAdminAccount
      tags: [admin-accounts]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeleteRequest"
      responses:
        "200":
          description: Account removed after safe reroute, snapshot activation, in-flight drain, and backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeleteResponse"
        "409":
          $ref: "#/components/responses/AccountLifecycleConflictResponse"
        "503":
          $ref: "#/components/responses/AccountLifecycleUnavailableResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/native-accounts:
    get:
      operationId: listAdminNativeAccounts
      tags: [admin-accounts]
      security:
        - adminSession: []
      responses:
        "200":
          description: Secret-free native account selector; management URLs exist only for loopback Hosts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeAccountCatalog"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/accounts/usage-breakdown:
    get:
      operationId: getAdminAccountUsageBreakdown
      tags: [admin-accounts]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AccountQuery"
        - $ref: "#/components/parameters/UsageWindowQuery"
        - $ref: "#/components/parameters/UsageStartAtQuery"
        - $ref: "#/components/parameters/UsageEndAtQuery"
      responses:
        "200":
          description: Account usage breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageBreakdown"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/accounts/rebalance-all:
    post:
      operationId: rebalanceAllAdminAccounts
      tags: [admin-accounts]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebalanceAllRequest"
      responses:
        "200":
          description: Atomic rebalance result after activity refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalanceResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/runtime/services:
    get:
      operationId: listAdminRuntimeServices
      tags: [admin-runtime]
      security:
        - adminSession: []
      responses:
        "200":
          description: Exact Compose-project service catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeServiceCatalog"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/runtime/logs:
    get:
      operationId: getAdminRuntimeLogs
      tags: [admin-runtime]
      security:
        - adminSession: []
      parameters:
        - name: target
          in: query
          schema:
            type: string
            default: all
      responses:
        "200":
          description: Redacted logs limited to the latest 200 lines and 2 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeLogs"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/runtime/jobs:
    get:
      operationId: listAdminRuntimeJobs
      tags: [admin-runtime]
      security:
        - adminSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 30
      responses:
        "200":
          description: Recent bounded in-process runtime jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeJobCatalog"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createAdminRuntimeJob
      tags: [admin-runtime]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeJobRequest"
      responses:
        "202":
          description: Runtime job accepted into the bounded pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeJobSubmissionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/runtime/jobs/{id}:
    get:
      operationId: getAdminRuntimeJob
      tags: [admin-runtime]
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current runtime job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeJobResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/runtime/jobs/{id}/cancel:
    post:
      operationId: cancelAdminRuntimeJob
      tags: [admin-runtime]
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Queued job cancelled or running job cancellation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeJobCancelResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/users:
    get:
      operationId: listAdminUsers
      tags: [admin-users]
      security:
        - adminSession: []
      parameters:
        - name: view
          in: query
          schema:
            type: string
            enum: [summary, members]
            default: summary
        - $ref: "#/components/parameters/UsageWindowQuery"
        - $ref: "#/components/parameters/UsageStartAtQuery"
        - $ref: "#/components/parameters/UsageEndAtQuery"
        - name: q
          in: query
          schema:
            type: string
        - name: team_id
          in: query
          schema:
            type: string
        - name: usage_state
          in: query
          schema:
            type: string
            enum: [all, used, unused]
            default: all
        - name: sort
          in: query
          schema:
            type: string
            enum: [email, requests, tokens, quota, last_used]
            default: tokens
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: fresh
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            enum: [25, 50, 100]
            default: 50
      responses:
        "200":
          description: Paginated secret-free user catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCatalog"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createAdminUser
      tags: [admin-users]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: One-time user credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreateResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/users/detail:
    get:
      operationId: getAdminUserDetail
      tags: [admin-users]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/EmailQuery"
        - $ref: "#/components/parameters/UsageWindowQuery"
        - $ref: "#/components/parameters/UsageStartAtQuery"
        - $ref: "#/components/parameters/UsageEndAtQuery"
      responses:
        "200":
          description: Lazy secret-free user account detail for the selected usage window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/users/quota:
    get:
      operationId: getAdminUserQuota
      tags: [admin-users]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/EmailQuery"
      responses:
        "200":
          description: Natural-week quota state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserQuotaResult"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: updateAdminUserQuota
      tags: [admin-users]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserQuotaRequest"
      responses:
        "200":
          description: Updated quota policy and current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserQuotaResult"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteAdminUserQuota
      tags: [admin-users]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/EmailQuery"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Inherited quota policy and current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserQuotaResult"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/users/usage-breakdown:
    get:
      operationId: getAdminUserUsageBreakdown
      tags: [admin-users]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/EmailQuery"
        - $ref: "#/components/parameters/UsageWindowQuery"
        - $ref: "#/components/parameters/UsageStartAtQuery"
        - $ref: "#/components/parameters/UsageEndAtQuery"
      responses:
        "200":
          description: User usage breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageBreakdown"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/keys/rotate:
    post:
      operationId: rotateAdminUserKey
      tags: [admin-users]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserKeyActionRequest"
      responses:
        "200":
          description: One-time replacement API Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserKeyRotationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/users/revoke:
    post:
      operationId: revokeAdminUser
      tags: [admin-users]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserEmailRequest"
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/users/reset-password:
    post:
      operationId: resetAdminUserPassword
      tags: [admin-users]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserEmailRequest"
      responses:
        "200":
          description: One-time replacement password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPasswordResetResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/users/delete:
    post:
      operationId: deleteAdminUser
      tags: [admin-users]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUserRequest"
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/users/team:
    put:
      operationId: updateAdminUserTeam
      tags: [admin-users]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserTeamRequest"
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/users/team/batch:
    post:
      operationId: updateAdminUserTeams
      tags: [admin-users]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserTeamsRequest"
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /admin/api/teams:
    get:
      operationId: listAdminTeams
      tags: [admin-teams]
      security:
        - adminSession: []
      responses:
        "200":
          description: Team catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamCatalog"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createAdminTeam
      tags: [admin-teams]
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
