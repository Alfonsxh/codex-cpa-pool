  /admin/api/overview/usage-report.xlsx:
    get:
      operationId: exportAdminWeeklyUsage
      tags: [admin-overview]
      summary: Download the complete administrative Token weekly report
      description: >-
        Five worksheets cover overview, teams, accounts, users and daily trends.
        Uses system.timezone and start-inclusive/end-exclusive calendar weeks.
        Defaults to the previous complete week. Current-week comparison ends at
        the previous week's same local weekday and time. Both periods use current
        team membership and stored historical weights, including orphan identities.
        Independent of overview filters. One export per Admin process, a 12-second
        query timeout, a 20-second generation budget, at most 100000 grouped usage
        rows and 20000 entries per identity dimension; limit failures return JSON
        instead of a truncated workbook. No credentials are included or cached.
      security:
        - adminSession: []
      parameters:
        - name: week_start
          in: query
          description: Monday date in system.timezone, from 1970 and no later than this week
          schema: { type: string, format: date }
        - name: with_units
          in: query
          description: Display Token cells and chart axes with K/M/B units while retaining numeric values; false displays complete numbers
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Complete XLSX report; current-week future days remain blank
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Attachment with a UTF-8 date-based filename
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        "504":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
